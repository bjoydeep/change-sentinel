apiVersion: v1
kind: ServiceAccount
metadata:
  name: change-sentinel
  namespace: change-sentinel

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: change-sentinel
rules:
  # Watch opted-in CRs — add an entry for each CRD group you configure in config.yaml
  - apiGroups: ["example.com"]
    resources: ["widgets"]
    verbs: ["get", "list", "watch"]

  # Discover CRDs with the opt-in label (used by future auto-discovery)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: change-sentinel
subjects:
  - kind: ServiceAccount
    name: change-sentinel
    namespace: change-sentinel
roleRef:
  kind: ClusterRole
  name: change-sentinel
  apiGroup: rbac.authorization.k8s.io

---
# Grant read access to OCP Thanos Querier metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: change-sentinel-monitoring-view
subjects:
  - kind: ServiceAccount
    name: change-sentinel
    namespace: change-sentinel
roleRef:
  kind: ClusterRole
  name: cluster-monitoring-view
  apiGroup: rbac.authorization.k8s.io
