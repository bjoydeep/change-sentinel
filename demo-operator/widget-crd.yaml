apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
  labels:
    # change-sentinel opt-in: watch all Widget CR instances for spec changes
    change-sentinel.io/watch-instances: "true"
  annotations:
    # what to watch for accumulation in the kube API server
    change-sentinel.io/observe-resources: "secrets,configmaps"
    # namespace resolved from each CR instance's own namespace at event time
    change-sentinel.io/observe-namespace: "{{.metadata.namespace}}"
spec:
  group: example.com
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                value:
                  type: string
                  description: Data to sync into a Secret
                description:
                  type: string
                  description: Human-readable description of this widget
              required:
                - value
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Value
          type: string
          jsonPath: .spec.value
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
