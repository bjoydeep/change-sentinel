apiVersion: v1
kind: ServiceAccount
metadata:
  name: widget-operator
  namespace: demo-operator-ns

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: widget-operator
rules:
  # kopf needs these cluster-wide
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  # Watch and patch Widget CRs (kopf writes progress to CR annotations)
  - apiGroups: ["example.com"]
    resources: ["widgets", "widgets/status"]
    verbs: ["get", "list", "watch", "patch", "update"]

  # Create secrets — this is the bug
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: widget-operator
subjects:
  - kind: ServiceAccount
    name: widget-operator
    namespace: demo-operator-ns
roleRef:
  kind: ClusterRole
  name: widget-operator
  apiGroup: rbac.authorization.k8s.io
